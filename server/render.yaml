services:
  - type: web
    name: pingo
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false # Render panelida qo'lda kiritiladi
      - key: SECRET_KEY
        sync: false # openssl rand -hex 32 — bir marta yaratiladi, hech qachon o'zgartirilmaydi
      - key: PUBLIC_URL
        sync: false # masalan https://pingo.onrender.com
      - key: AGENT_PACKAGE
        value: pingo-agent
